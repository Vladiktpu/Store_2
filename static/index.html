<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интернет-магазин</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
        }

        .add-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .add-form h2 {
            margin-bottom: 15px;
            color: #555;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        input, textarea {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            font-family: inherit;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .product-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .product-description {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 10px;
            font-style: italic;
        }

        .product-price {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
            margin: 10px 0;
        }

        .product-price::after {
            content: " ₽";
            font-size: 0.8em;
        }

        .product-stock {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .product-stock.low {
            color: #e53e3e;
            font-weight: bold;
        }

        .card-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-edit {
            background: #48bb78;
        }

        .btn-edit:hover {
            background: #38a169;
        }

        .btn-delete {
            background: #f56565;
        }

        .btn-delete:hover {
            background: #e53e3e;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #666;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success {
            background: #c6f6d5;
            color: #22543d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
        }

        .modal-content h3 {
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .form-group {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛍️ Интернет-магазин</h1>
        
        <div id="message" style="display: none;"></div>
        
        <div class="add-form">
            <h2>➕ Добавить новый товар</h2>
            <div class="form-group">
                <div class="form-field">
                    <label>Название товара</label>
                    <input type="text" id="name" placeholder="Например: Смартфон">
                </div>
                <div class="form-field">
                    <label>Описание</label>
                    <textarea id="description" rows="1" placeholder="Краткое описание товара"></textarea>
                </div>
                <div class="form-field">
                    <label>Цена (₽)</label>
                    <input type="number" id="price" placeholder="1000">
                </div>
                <div class="form-field">
                    <label>Количество на складе</label>
                    <input type="number" id="stock" placeholder="10">
                </div>
                <button onclick="addProduct()">➕ Добавить</button>
            </div>
        </div>

        <h2>📦 Товары в наличии</h2>
        <div id="products-container">
            <div class="loading">Загрузка товаров...</div>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3>✏️ Редактировать товар</h3>
            <div class="form-field" style="margin-bottom: 15px;">
                <label>Название</label>
                <input type="text" id="edit-name">
            </div>
            <div class="form-field" style="margin-bottom: 15px;">
                <label>Описание</label>
                <textarea id="edit-description" rows="3"></textarea>
            </div>
            <div class="form-field" style="margin-bottom: 15px;">
                <label>Цена (₽)</label>
                <input type="number" id="edit-price">
            </div>
            <div class="form-field" style="margin-bottom: 15px;">
                <label>Количество на складе</label>
                <input type="number" id="edit-stock">
            </div>
            <div class="modal-buttons">
                <button onclick="closeModal()">Отмена</button>
                <button class="btn-edit" onclick="saveEdit()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        let currentEditId = null;

        function showMessage(text, type = 'error') {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = type;
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        async function loadProducts() {
            try {
                const response = await fetch('/products');
                if (!response.ok) throw new Error('Ошибка загрузки товаров');
                const products = await response.json();
                displayProducts(products);
            } catch (error) {
                console.error('Error:', error);
                showMessage('Не удалось загрузить товары', 'error');
                document.getElementById('products-container').innerHTML = '<div class="loading">❌ Ошибка загрузки товаров</div>';
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('products-container');
            
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="loading">😕 Товаров пока нет</div>';
                return;
            }

            let html = '<div class="products-grid">';
            
            products.forEach(product => {
                const stock = product.stock || 0;
                const price = product.price || 0;
                const name = product.name || 'Без названия';
                const description = product.description || '';
                const id = product.id;
                
                html += `
                    <div class="product-card">
                        <div class="product-name">${escapeHtml(name)}</div>
                        ${description ? `<div class="product-description">${escapeHtml(description)}</div>` : ''}
                        <div class="product-price">${price}</div>
                        <div class="product-stock ${stock < 5 ? 'low' : ''}">
                            📦 На складе: ${stock} шт.
                            ${stock < 5 && stock > 0 ? ' (осталось мало!)' : ''}
                            ${stock === 0 ? ' (нет в наличии)' : ''}
                        </div>
                        <div class="card-buttons">
                            <button class="btn-edit" onclick="openEditModal(${id})">✏️ Редактировать</button>
                            <button class="btn-delete" onclick="deleteProduct(${id})">🗑️ Удалить</button>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        async function addProduct() {
            const name = document.getElementById('name').value.trim();
            const description = document.getElementById('description').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            const stock = parseInt(document.getElementById('stock').value);

            if (!name) {
                showMessage('Введите название товара', 'error');
                return;
            }
            if (isNaN(price) || price <= 0) {
                showMessage('Цена должна быть больше 0', 'error');
                return;
            }
            if (isNaN(stock) || stock < 0) {
                showMessage('Количество не может быть отрицательным', 'error');
                return;
            }

            try {
                const response = await fetch('/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, description, price, stock })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка добавления');
                }

                document.getElementById('name').value = '';
                document.getElementById('description').value = '';
                document.getElementById('price').value = '';
                document.getElementById('stock').value = '';
                
                await loadProducts();
                showMessage('✅ Товар успешно добавлен!', 'success');
            } catch (error) {
                console.error('Error:', error);
                showMessage(error.message, 'error');
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Вы уверены, что хотите удалить этот товар?')) return;

            try {
                const response = await fetch(`/products/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Ошибка удаления');
                
                await loadProducts();
                showMessage('✅ Товар удален', 'success');
            } catch (error) {
                console.error('Error:', error);
                showMessage('Не удалось удалить товар', 'error');
            }
        }

        async function openEditModal(id) {
            try {
                const response = await fetch(`/products/${id}`);
                if (!response.ok) throw new Error('Ошибка загрузки товара');
                const product = await response.json();
                
                currentEditId = id;
                document.getElementById('edit-name').value = product.name || '';
                document.getElementById('edit-description').value = product.description || '';
                document.getElementById('edit-price').value = product.price || 0;
                document.getElementById('edit-stock').value = product.stock || 0;
                
                document.getElementById('edit-modal').style.display = 'flex';
            } catch (error) {
                console.error('Error:', error);
                showMessage('Не удалось загрузить данные товара', 'error');
            }
        }

        async function saveEdit() {
            const name = document.getElementById('edit-name').value.trim();
            const description = document.getElementById('edit-description').value.trim();
            const price = parseFloat(document.getElementById('edit-price').value);
            const stock = parseInt(document.getElementById('edit-stock').value);

            if (!name || isNaN(price) || price <= 0 || isNaN(stock) || stock < 0) {
                showMessage('Проверьте правильность заполнения полей', 'error');
                return;
            }

            try {
                const response = await fetch(`/products/${currentEditId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, description, price, stock })
                });

                if (!response.ok) throw new Error('Ошибка обновления');
                
                closeModal();
                await loadProducts();
                showMessage('✅ Товар обновлен', 'success');
            } catch (error) {
                console.error('Error:', error);
                showMessage('Не удалось обновить товар', 'error');
            }
        }

        function closeModal() {
            document.getElementById('edit-modal').style.display = 'none';
            currentEditId = null;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Загружаем товары при загрузке страницы
        loadProducts();
    </script>
</body>
</html>
